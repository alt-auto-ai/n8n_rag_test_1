<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BCSDA Chat Assistant</title>
  <style>
    :root {
      --bg-color: #0e0f11;
      --accent-color: #007acc;
      --input-bg: #1c1e22;
      --text-color: #ffffff;
      --bubble-bg: #2a2c30;
      --bot-bubble-color: #007acc;
      --font-stack: 'Segoe UI', sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-stack);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .chat-container {
      width: 90%;
      max-width: 900px;
      height: 90vh;
      display: flex;
      flex-direction: column;
      background-color: var(--input-bg);
      border-radius: 12px;
      box-shadow: 0 0 12px rgba(0,0,0,0.5);
      overflow: hidden;
    }

    .chat-header {
      padding: 1rem;
      background-color: var(--bg-color);
      border-bottom: 1px solid #2c2f35;
    }

    .chat-header h1 {
      font-size: 1.5rem;
      margin: 0;
    }

    .chat-header p {
      margin: 0.25rem 0 0;
      color: #aaa;
      font-size: 0.95rem;
    }

    .chat-body {
      flex: 1;
      padding: 1rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .message {
      max-width: 75%;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      line-height: 1.4;
    }

    .user-message {
      align-self: flex-end;
      background-color: var(--bubble-bg);
    }

    .bot-message {
      align-self: flex-start;
      background-color: var(--bot-bubble-color);
      color: white;
    }

    .chat-input {
      display: flex;
      border-top: 1px solid #2c2f35;
      background-color: var(--bg-color);
    }

    .chat-input input {
      flex: 1;
      padding: 1rem;
      background: transparent;
      color: var(--text-color);
      border: none;
      font-size: 1rem;
    }

    .chat-input button {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 0 1.5rem;
      cursor: pointer;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <h1>Welcome to BCSDA Network Intelligence Agent</h1>
      <p>Ask anything about the network</p>
    </div>
    <div class="chat-body" id="chat">
      <div class="bot-message message">Hi there! 👋</div>
      <div class="bot-message message">My name is Nathan. How can I assist you today?</div>
    </div>
    <div class="chat-input">
      <input type="text" id="userInput" placeholder="Type your question.." />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('userInput');

    async function sendMessage() {
      const msg = input.value.trim();
      if (!msg) return;

      const userBubble = document.createElement('div');
      userBubble.className = 'user-message message';
      userBubble.textContent = msg;
      chat.appendChild(userBubble);

      input.value = '';
      chat.scrollTop = chat.scrollHeight;

      const response = await fetch('https://alt-auto-ai.app.n8n.cloud/webhook/e985d15f-b2f6-456d-be15-97e0b1544a40/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: msg })
      });

      const data = await response.json();
      const reply = document.createElement('div');
      reply.className = 'bot-message message';
      reply.textContent = data?.message || 'No response.';
      chat.appendChild(reply);
      chat.scrollTop = chat.scrollHeight;
    }
  </script>
</body>
</html>
